name: Signed Release APK

# بناء نسخة موقّعة جاهزة للنشر على المتاجر.
# يعمل يدوياً فقط، ويحتاج هذه الأسرار في إعدادات المستودع:
#   ANDROID_KEYSTORE_BASE64    ملف .keystore مُرمَّز بـ base64
#   ANDROID_KEYSTORE_PASSWORD  كلمة مرور المخزن
#   ANDROID_KEY_ALIAS          اسم المفتاح داخل المخزن
#   ANDROID_KEY_PASSWORD       كلمة مرور المفتاح
#
# لإنشاء مخزن مفاتيح جديد:
#   keytool -genkey -v -keystore release.keystore -alias smartquiz \
#           -keyalg RSA -keysize 2048 -validity 10000
#   base64 -w0 release.keystore > release.keystore.b64

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  signed:
    name: بناء نسخة موقّعة
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: التحقق من وجود الأسرار
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::error::أسرار التوقيع غير مضبوطة. راجع التعليقات في أعلى هذا الملف."
            exit 1
          fi

      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Install system deps
        run: |
          sudo apt-get update -y
          sudo apt-get install -y \
            build-essential git python3-dev python3-pip ffmpeg \
            libsdl2-dev libsdl2-image-dev libsdl2-mixer-dev libsdl2-ttf-dev \
            libportmidi-dev libswscale-dev libavformat-dev libavcodec-dev \
            zlib1g-dev unzip zip autoconf libtool pkg-config \
            libncurses5-dev libncursesw5-dev cmake libffi-dev libssl-dev

      - name: Install buildozer
        run: |
          pip install --upgrade pip
          pip install buildozer==1.5.0 cython==3.0.11

      - name: Cache buildozer
        uses: actions/cache@v4
        with:
          path: |
            ~/.buildozer
            .buildozer
          key: buildozer-${{ runner.os }}-${{ hashFiles('buildozer.spec') }}
          restore-keys: buildozer-${{ runner.os }}-

      - name: Setup Android SDK
        run: |
          SDK_DIR=$HOME/.buildozer/android/platform/android-sdk
          mkdir -p $SDK_DIR/cmdline-tools $SDK_DIR/licenses $SDK_DIR/tools/bin
          wget -q https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip -O /tmp/cmdline-tools.zip
          unzip -q -o /tmp/cmdline-tools.zip -d $SDK_DIR/cmdline-tools
          mv $SDK_DIR/cmdline-tools/cmdline-tools $SDK_DIR/cmdline-tools/latest 2>/dev/null || true
          ln -sf $SDK_DIR/cmdline-tools/latest/bin/sdkmanager $SDK_DIR/tools/bin/sdkmanager
          printf '\n24333f8a63b6825ea9c5514f83c2829b004d1fee\n84831b9409646a918e30573bab4c9c91346d8abd\nd975f751698a77b662f1254ddbeed3901e976f5a\n' > $SDK_DIR/licenses/android-sdk-license
          printf '\n33b6a2b64607f11b759f320ef9dff4ae5c47d97a\n' > $SDK_DIR/licenses/android-sdk-preview-license
          $SDK_DIR/cmdline-tools/latest/bin/sdkmanager --sdk_root=$SDK_DIR \
            "platform-tools" "build-tools;34.0.0" "platforms;android-33" 2>&1 | tail -5

      - name: فك ترميز مخزن المفاتيح
        run: echo "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" | base64 -d > "$HOME/release.keystore"

      - name: بناء APK موقّع
        env:
          P4A_RELEASE_KEYSTORE: /home/runner/release.keystore
          P4A_RELEASE_KEYSTORE_PASSWD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          P4A_RELEASE_KEYALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          P4A_RELEASE_KEYALIAS_PASSWD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: buildozer -v android release 2>&1

      - name: تنظيف مخزن المفاتيح
        if: always()
        run: rm -f "$HOME/release.keystore"

      - name: رفع الناتج
        uses: actions/upload-artifact@v4
        with:
          name: smart-quiz-signed
          path: bin/*.apk
          if-no-files-found: error
