name: Build APK

on: [push, workflow_dispatch]

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Install system deps
        run: |
          sudo apt-get update -y
          sudo apt-get install -y \
            build-essential \
            git \
            python3-dev \
            python3-pip \
            ffmpeg \
            libsdl2-dev \
            libsdl2-image-dev \
            libsdl2-mixer-dev \
            libsdl2-ttf-dev \
            libportmidi-dev \
            libswscale-dev \
            libavformat-dev \
            libavcodec-dev \
            zlib1g-dev \
            unzip \
            zip \
            autoconf \
            libtool \
            pkg-config \
            libncurses5-dev \
            libncursesw5-dev \
            cmake \
            libffi-dev \
            libssl-dev

      - name: Install buildozer and dependencies
        run: |
          pip install --upgrade pip
          pip install buildozer==1.5.0
          pip install cython==3.0.11

      - name: Setup Android SDK
        run: |
          SDK_DIR=$HOME/.buildozer/android/platform/android-sdk
          mkdir -p $SDK_DIR

          # تنزيل command-line tools
          wget -q https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip -O /tmp/cmdline-tools.zip
          mkdir -p $SDK_DIR/cmdline-tools
          unzip -q /tmp/cmdline-tools.zip -d $SDK_DIR/cmdline-tools
          mv $SDK_DIR/cmdline-tools/cmdline-tools $SDK_DIR/cmdline-tools/latest 2>/dev/null || true

          # إنشاء sdkmanager في المسار القديم الذي يبحث عنه buildozer 1.5.0
          mkdir -p $SDK_DIR/tools/bin
          ln -sf $SDK_DIR/cmdline-tools/latest/bin/sdkmanager $SDK_DIR/tools/bin/sdkmanager
          ln -sf $SDK_DIR/cmdline-tools/latest/bin/avdmanager $SDK_DIR/tools/bin/avdmanager

          # قبول جميع التراخيص مسبقاً
          mkdir -p $SDK_DIR/licenses
          echo -e "\n24333f8a63b6825ea9c5514f83c2829b004d1fee" > $SDK_DIR/licenses/android-sdk-license
          echo -e "\n84831b9409646a918e30573bab4c9c91346d8abd" >> $SDK_DIR/licenses/android-sdk-license
          echo -e "\nd975f751698a77b662f1254ddbeed3901e976f5a" >> $SDK_DIR/licenses/android-sdk-license
          echo -e "\n33b6a2b64607f11b759f320ef9dff4ae5c47d97a" > $SDK_DIR/licenses/android-sdk-preview-license
          echo -e "\n601085b94cd77f0b54ff86406957099ebe79c4d6" > $SDK_DIR/licenses/android-googletv-license

          # تثبيت platform-tools و build-tools
          $SDK_DIR/cmdline-tools/latest/bin/sdkmanager \
            --sdk_root=$SDK_DIR \
            "platform-tools" \
            "build-tools;34.0.0" \
            "platforms;android-33" 2>&1 | tail -5

          echo "✅ Android SDK setup complete"

      - name: Build APK
        run: |
          buildozer -v android debug 2>&1
        env:
          JAVA_HOME: ${{ env.JAVA_HOME }}

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: smart-quiz-apk
          path: bin/*.apk
          if-no-files-found: warn
