name: Build APK

on: [push, workflow_dispatch]

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install system deps
        run: |
          sudo apt-get update -y
          sudo apt-get install -y \
            build-essential \
            git \
            python3-dev \
            python3-pip \
            ffmpeg \
            libsdl2-dev \
            libsdl2-image-dev \
            libsdl2-mixer-dev \
            libsdl2-ttf-dev \
            libportmidi-dev \
            libswscale-dev \
            libavformat-dev \
            libavcodec-dev \
            zlib1g-dev \
            openjdk-17-jdk \
            unzip \
            zip \
            autoconf \
            libtool \
            pkg-config \
            libncurses5-dev \
            libncursesw5-dev \
            cmake \
            libffi-dev \
            libssl-dev

      - name: Set JAVA_HOME
        run: |
          echo "JAVA_HOME=$(dirname $(dirname $(readlink -f $(which java))))" >> $GITHUB_ENV

      - name: Install buildozer and dependencies
        run: |
          pip install --upgrade pip
          pip install buildozer==1.5.0
          pip install cython==0.29.33

      - name: Accept Android SDK licenses
        run: |
          mkdir -p $HOME/.android
          touch $HOME/.android/repositories.cfg
          # قبول جميع تراخيص Android SDK
          yes | $ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager --licenses 2>/dev/null || true
          yes | $ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager "build-tools;37.0.0" 2>/dev/null || true
          # إنشاء ملف قبول التراخيص يدوياً
          mkdir -p $HOME/.android
          for f in $ANDROID_SDK_ROOT/licenses/*.txt; do
            fname=$(basename "$f")
            mkdir -p $ANDROID_SDK_ROOT/licenses
            cat "$f" > $ANDROID_SDK_ROOT/licenses/"$fname" 2>/dev/null || true
          done
          # قبول تراخيص buildozer
          mkdir -p $HOME/.buildozer/android/platform
          echo "y" > /tmp/accept_licenses.txt

      - name: Build APK
        run: |
          # قبول التراخيص تلقائياً خلال buildozer
          yes | buildozer -v android debug 2>&1 || buildozer -v android debug 2>&1
        env:
          JAVA_HOME: ${{ env.JAVA_HOME }}
          ANDROID_SDK_ROOT: ${{ env.ANDROID_SDK_ROOT }}

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: smart-quiz-apk
          path: bin/*.apk
          if-no-files-found: warn
